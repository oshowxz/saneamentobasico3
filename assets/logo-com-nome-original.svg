<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" role="img" aria-label="Mapa do Saneamento de Sinop" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0284C7"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <radialGradient id="heat" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F97316" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#FACC15" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- mancha de calor atrás do pin -->
  <ellipse cx="85" cy="138" rx="62" ry="22" fill="url(#heat)"/>
  <ellipse cx="85" cy="138" rx="36" ry="11" fill="url(#heat)"/>

  <!-- pin de mapa -->
  <path d="M85 14 C56 14 36 37 36 64 C36 98 85 142 85 142 C85 142 134 98 134 64 C134 37 114 14 85 14 Z" fill="url(#pin)"/>

  <!-- gota d'água -->
  <path d="M85 38 C85 38 65 62 65 75 C65 86 74 95 85 95 C96 95 105 86 105 75 C105 62 85 38 85 38 Z" fill="#FFFFFF"/>
  <path d="M76 76 C76 82 80 86 85 87" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>

  <!-- texto -->
  <text x="160" y="84" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="50" font-weight="800" fill="#0F172A" letter-spacing="-1">Saneamento</text>
  <text x="162" y="116" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#0F766E" letter-spacing="7">SINOP · MT</text>

  <!-- barra de escala de calor -->
  <rect x="162" y="128" width="300" height="7" rx="3.5" fill="#E2E8F0"/>
  <rect x="162" y="128" width="100" height="7" rx="3.5" fill="#0284C7"/>
  <rect x="262" y="128" width="100" height="7" fill="#22C55E"/>
  <rect x="362" y="128" width="100" height="7" rx="3.5" fill="#F97316"/>
</svg>
